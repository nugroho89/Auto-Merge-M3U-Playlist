name: Auto-Merge M3U Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  merge-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create and Update Playlist File
        run: |
          # Buat file playlist.m3u baru dengan baris header
          echo "#EXTM3U" > playlist.m3u
          
          # Jika Anda memiliki URL sumber playlist lain, masukkan di bawah ini (opsional):
          # curl -s "https://link-playlist-sumber.com/live.m3u" | grep -v "^#EXTM3U" >> playlist.m3u || true

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan."
          else
            git commit -m "Auto update playlist.m3u [skip ci]"
            git push
          fi
