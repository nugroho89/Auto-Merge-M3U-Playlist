name: Auto Merge M3U Playlists

on:
  schedule:
    # Berjalan otomatis setiap 12 jam sekali
    - cron: '0 */12 * * *'
  workflow_dispatch: # Tombol untuk menjalankan update manual dari web GitHub

jobs:
  merge-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Ambil dan Gabungkan M3U dari Berbagai Sumber
        run: |
          # 1. Download playlist dari berbagai sumber luar (Termasuk dhanytv)
          curl -s https://iptv-org.github.io/iptv/countries/id.m3u > sumber1.m3u
          curl -s https://iptv-org.github.io/iptv/categories/kids.m3u > sumber2.m3u
          curl -s https://raw.githubusercontent.com/dhasap/dhanytv/refs/heads/main/dhanytv.m3u > sumber3.m3u

          # 2. Gabungkan ketiga sumber ke dalam satu file 'playlist.m3u'
          cat sumber1.m3u sumber2.m3u sumber3.m3u > playlist.m3u

      - name: Simpan dan Commit Perubahan ke Repo Anda
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Auto update playlist M3U dari berbagai sumber" || exit 0
          git push
