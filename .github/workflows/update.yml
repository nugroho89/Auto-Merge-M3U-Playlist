name: Auto Merge M3U Playlists

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-playlists:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Ambil dan Gabungkan M3U
        run: |
          curl -sL "https://iptv-org.github.io/iptv/countries/id.m3u" > sumber1.m3u
          curl -sL "https://iptv-org.github.io/iptv/categories/kids.m3u" > sumber2.m3u
          curl -sL "https://raw.githubusercontent.com/dhasap/dhanytv/refs/heads/main/dhanytv.m3u" > sumber3.m3u

          cat sumber1.m3u sumber2.m3u sumber3.m3u > playlist.m3u

      - name: Commit File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git commit -m "Auto update playlist M3U" || echo "Tidak ada perubahan"

      - name: Push Perubahan
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
